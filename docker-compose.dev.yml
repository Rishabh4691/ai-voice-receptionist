name: ai-reception-dev

services:
  api:
    build: .
    container_name: ai-reception-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:3040:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - /home/kanal/secrets/voice-bot.env
    environment:
      - PORT=3000
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
